workflows:
  android-build:
    name: Quattro Launcher Build
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      java: 17
      vars:
        NDK_VERSION: "25.2.9519653"
    scripts:
      - name: Install and Set NDK
        script: | 
          # Install the specific NDK version requested
          echo "y" | sdkmanager --install "ndk;$NDK_VERSION"
          
          # Set up local.properties with the correct paths for M2
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "ndk.dir=$ANDROID_SDK_ROOT/ndk/$NDK_VERSION" >> local.properties
          
          # Optional: Export NDK path to environment for build tools
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/$NDK_VERSION" >> $CM_ENV
      - name: Set executable permissions
        script: chmod +x gradlew
      - name: Build Debug APK
        script: | 
          ./gradlew assembleDebug
    artifacts:
      - app/build/outputs/apk/**/*.apk
    publishing:
      email:
        recipients:
          - funpasscloud518@gmail.com
