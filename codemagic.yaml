workflows:
  android-build:
    name: Quattro Launcher Build
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      java: 17
      vars:
        # We define a custom NDK path that we KNOW exists
        NDK_VERSION: "25.2.9519653"
        ANDROID_NDK_HOME: $HOME/android-ndk-custom
        scripts:
      - name: Setup and Build Release
        script: | 
          # 1. Prepare Environment
          rm -f local.properties
          echo "y" | sdkmanager --install "ndk;25.2.9519653"
          chmod +x gradlew
          
          # 2. Run the Release Build
          # The '\' at the end of the lines is CRITICAL
          ./gradlew :app_pojavlauncher:assembleRelease -x lintVitalRelease \
            -Pandroid.ndkVersion="25.2.9519653" \
            -Pandroid.builder.sdkDownload=true

    artifacts:
      - app/build/outputs/apk/**/*.apk
      - app_pojavlauncher/build/outputs/apk/**/*.apk
    publishing:
      email:
        recipients:
          - funpasscloud518@gmail.com
