workflows:
  android-build:
    name: Quattro Launcher Build
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      java: 17
      vars:
        NDK_VERSION: "25.2.9519653"
        # If you have other variables like ANDROID_NDK_HOME, put them here
        
    scripts:
      - name: Download JRE and Native Libs
        script: | 
          # Create the folders if they don't exist
          mkdir -p app_pojavlauncher/src/main/assets/components/jre
          
          # Download JRE 17 (Required for modern Minecraft versions)
          curl -L https://github.com/PojavLauncherTeam/android-openjdk-build-multiarch/releases/download/17-7639f70/jre17-arm64.tar.xz -o app_pojavlauncher/src/main/assets/components/jre/jre17-arm64.tar.xz
          
          # Download JRE 8 (Required for older versions)
          curl -L https://github.com/PojavLauncherTeam/android-openjdk-build-multiarch/releases/download/jre8-8dd333a/jre8-arm64.tar.xz -o app_pojavlauncher/src/main/assets/components/jre/jre8-arm64.tar.xz

      - name: Setup and Build
        script: |
          rm -f local.properties
          # Ensure NDK is installed
          echo "y" | sdkmanager --install "ndk;25.2.9519653"
          chmod +x gradlew
          
          # Run build
          ./gradlew :app_pojavlauncher:assembleDebug -Pandroid.ndkVersion="25.2.9519653"

    artifacts:
      - app_pojavlauncher/build/outputs/apk/**/*.apk
      
    publishing:
      email:
        recipients:
          - funpasscloud518@gmail.com
