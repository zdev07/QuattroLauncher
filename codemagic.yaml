workflows:
  android-build:
    name: Quattro Launcher Build
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      java: 17
      vars:
        # We define a custom NDK path that we KNOW exists
        NDK_VERSION: "25.2.9519653"
        ANDROID_NDK_HOME: $HOME/android-ndk-custom
    scripts:
      - name: Setup NDK and Build
        script: | 
          # 1. Clean up any previous failed attempts
          rm -f local.properties
          
          # 2. Use the sdkmanager to ensure the NDK is installed in the default location
          # Codemagic M2 usually has NDKs at $ANDROID_SDK_ROOT/ndk/
          echo "y" | sdkmanager --install "ndk;25.2.9519653"
          
          # 3. Set executable permissions
          chmod +x gradlew
          
          # 4. Run the build. 
          # We force Gradle to use the specific version and ignore the 'custom' paths.
          ./gradlew assembleDebug \
            -Pandroid.ndkVersion="25.2.9519653" \
            -Pandroid.builder.sdkDownload=true

      - name: Set executable permissions
        script: chmod +x gradlew
        
      - name: Build Debug APK
        script: | 
          # We pass the NDK path directly into the gradle command to override everything
          ./gradlew assembleGplay \
            -Pandroid.builder.sdkDownload=false \
            -Dorg.gradle.project.android.ndkPath=$HOME/android-ndk-custom
            
    artifacts:
      - app/build/outputs/apk/**/*.apk
      - app_pojavlauncher/build/outputs/apk/**/*.apk
    publishing:
      email:
        recipients:
          - funpasscloud518@gmail.com
