workflows:
  android-build:
    name: Quattro Launcher Build
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      java: 17
      vars:
        NDK_VERSION: "25.2.9519653"
    scripts:
      - name: Setup and Build
        script: | 
          # 1. Prepare Environment
          rm -f local.properties
          echo "y" | sdkmanager --install "ndk;25.2.9519653"
          chmod +x gradlew
          
          # 2. Run the Debug Build
          ./gradlew :app_pojavlauncher:assembleDebug \
            -Pandroid.ndkVersion="25.2.9519653" \
            -Pandroid.builder.sdkDownload=true
            
    artifacts:
      # FIX: Changed 'release' to '**' to catch APKs regardless of build type
      # This will find: app_pojavlauncher/build/outputs/apk/debug/*.apk
      - app_pojavlauncher/build/outputs/apk/**/*.apk
    publishing:
      email:
        recipients:
          - funpasscloud518@gmail.com
