plugins {
    id 'com.android.application' version '8.7.2'
}

static def getDate() { return new Date().format('yyyyMMdd') }

static def getDateSeconds() {
    if (System.getenv("GITHUB_ACTIONS") == "true") {
        return 9934841 + Integer.parseInt(System.getenv("GITHUB_RUN_NUMBER"))
    } else {
        return 172005
    }
}

def getCFApiKey = {
    String key = System.getenv("CURSEFORGE_API_KEY");
    if(key != null) return key;
    File curseforgeKeyFile = new File("./curseforge_key.txt");
    if(curseforgeKeyFile.canRead() && curseforgeKeyFile.isFile()) {
        return curseforgeKeyFile.text;
    }
    return "DUMMY";
}

android {
    namespace 'net.kdt.pojavlaunch'
    compileSdk 34

    defaultConfig {
        applicationId "zx.offical.quattro"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode getDateSeconds()
        versionName "Quattrov1"
        multiDexEnabled true
        resValue 'string', 'curseforge_api_key', getCFApiKey()
        
        // CRITICAL: Tells the NDK which architectures to pack
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }
    }

    // THIS SECTION IS MISSING IN YOUR CODE
    // It tells Gradle where the actual Java runtimes and Native Renderers are
    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
            assets.srcDirs = ['src/main/assets']
        }
    }

    signingConfigs {
        customDebug {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        debug {
            resValue "string", "app_name", "QuattroLauncher (Debug)"
            applicationIdSuffix '.debug'
            signingConfig signingConfigs.customDebug
            resValue 'string', 'application_package', 'zx.offical.quattro.debug'
            resValue 'string', 'storageProviderAuthorities', 'zx.offical.quattro.scoped.gamefolder.debug'
            resValue 'string', 'shareProviderAuthority', 'zx.offical.quattro.scoped.controlfolder.debug'
        }

        release {
            resValue "string", "app_name", "QuattroLauncher"
            // KEEP THESE FALSE to ensure logic doesn't break
            minifyEnabled false
            shrinkResources false 
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            resValue 'string', 'application_package', 'zx.offical.quattro'
            resValue 'string', 'storageProviderAuthorities', 'zx.offical.quattro.scoped.gamefolder'
            resValue 'string', 'shareProviderAuthority', 'zx.offical.quattro.scoped.controlfolder'
        }
    }

    ndkVersion = "25.2.9519653"

    externalNativeBuild {
        ndkBuild {
            path file('src/main/jni/Android.mk')
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
        pickFirst '**/libbytehook.so'
        // Prevent duplicate file errors
        exclude 'META-INF/DEPENDENCIES'
    }

    buildFeatures {
        prefab true
        buildConfig true
    }
    
    // Fix for the String formatting errors in your logs
    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation 'javax.annotation:javax.annotation-api:1.3.2'
    implementation 'commons-codec:commons-codec:1.15'
    implementation 'androidx.preference:preference:1.2.0'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
    implementation 'androidx.viewpager2:viewpager2:1.1.0-beta01'
    implementation 'androidx.annotation:annotation:1.5.0'
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"
    implementation 'com.github.duanhong169:checkerboarddrawable:1.0.2'
    implementation 'com.github.PojavLauncherTeam:portrait-sdp:ed33e89cbc'
    implementation 'com.github.PojavLauncherTeam:portrait-ssp:6c02fd739b'
    implementation 'com.github.Mathias-Boulay:ExtendedView:1.0.0'
    implementation 'com.github.Mathias-Boulay:android_gamepad_remapper:2.0.3'
    implementation 'com.github.Mathias-Boulay:virtual-joystick-android:1.14'
    implementation 'org.tukaani:xz:1.8'
    implementation 'net.sourceforge.htmlcleaner:htmlcleaner:2.6.1'
    implementation 'com.bytedance:bytehook:1.0.9'
    implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])
}

// Fixed the asset dependency trigger
afterEvaluate {
    if (tasks.findByName("mergeReleaseAssets")) {
        tasks.mergeReleaseAssets.dependsOn(":forge_installer:jar", ":arc_dns_injector:jar", ":jre_lwjgl3glfw:jar")
    }
    if (tasks.findByName("mergeDebugAssets")) {
        tasks.mergeDebugAssets.dependsOn(":forge_installer:jar", ":arc_dns_injector:jar", ":jre_lwjgl3glfw:jar")
    }
}
